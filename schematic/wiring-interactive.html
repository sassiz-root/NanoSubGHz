<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoSubGHz — Interactive Wiring</title>
<style>
  :root {
    --bg: #f5f5f5; --panel-bg: #ffffff; --border: #e0e0e0;
    --text: #212121; --text-muted: #757575;
    --accent: #1976d2; --accent-dark: #0d47a1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* ===== Header ===== */
  header {
    background: var(--panel-bg); border-bottom: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; flex-shrink: 0;
  }
  .brand { font-weight: 700; font-size: 17px; color: var(--accent-dark); white-space: nowrap; }
  .brand small { font-weight: 400; font-size: 11px; color: var(--text-muted); margin-left: 8px; }
  .controls { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    padding: 5px 12px; background: transparent; border: none; cursor: pointer;
    font-size: 12px; color: var(--text); font-family: inherit;
  }
  .seg button.active { background: var(--accent); color: white; }
  .seg button:hover:not(.active) { background: #f0f0f0; }
  .btn-zoom {
    min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel-bg); cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .btn-zoom:hover { background: #f0f0f0; }

  /* ===== Main layout ===== */
  .main { flex: 1; display: grid; grid-template-columns: 260px 1fr 320px; overflow: hidden; }
  .sidebar {
    background: var(--panel-bg); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  .sidebar:last-child { border-right: none; border-left: 1px solid var(--border); }
  .sidebar h3 {
    font-size: 12px; text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 10px; letter-spacing: 0.5px; font-weight: 700;
  }
  .component-item {
    display: flex; align-items: center; gap: 8px; padding: 6px;
    border-radius: 4px; cursor: pointer; font-size: 13px;
    transition: background 0.15s;
  }
  .component-item:hover { background: #f0f0f0; }
  .component-item.selected { background: #e3f2fd; }
  .component-item input[type=checkbox] { cursor: pointer; }
  .swatch {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.2);
  }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .action-btn {
    width: 100%; padding: 7px; font-size: 12px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--panel-bg); cursor: pointer; margin-top: 6px;
  }
  .action-btn:hover { background: #f0f0f0; }

  /* ===== Canvas ===== */
  .canvas-wrap {
    position: relative; overflow: hidden; background: #fafafa;
    display: flex; align-items: center; justify-content: center;
  }
  #diagram {
    width: 100%; height: 100%; transition: transform 0.35s ease;
    transform-origin: center center;
  }
  #svg { width: 100%; height: 100%; }
  .comp { cursor: move; }
  .comp:active { cursor: grabbing; }
  .comp:hover .comp-body { filter: brightness(0.96); }
  .comp.selected .comp-body { stroke-width: 4 !important; }
  .comp-body { transition: stroke-width 0.2s; }
  .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .pin-dot { fill: #c62828; stroke: white; stroke-width: 1.5; }
  .pin-label { font-size: 10px; font-family: monospace; fill: #c62828; font-weight: 600; pointer-events: none; }

  /* ===== Footer ===== */
  footer {
    background: var(--panel-bg); border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  footer label { font-size: 13px; display: flex; align-items: center; gap: 8px; flex: 1; }
  footer input[type=range] { flex: 1; max-width: 400px; }
  #explodeVal { min-width: 42px; text-align: right; font-family: monospace; font-size: 12px; }

  /* ===== Info panel ===== */
  .info-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 20px; line-height: 1.6; }
  .info-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--accent-dark); }
  .info-section { margin-bottom: 14px; }
  .info-section h4 {
    font-size: 10px; text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 6px; letter-spacing: 0.5px; font-weight: 700;
  }
  .info-section p, .info-section li { font-size: 12px; line-height: 1.6; color: #424242; }
  .info-section ul { padding-left: 16px; }
  .pin-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .pin-chip {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: #e3f2fd; color: #1565c0; font-family: monospace; font-weight: 600;
  }

  /* ===== RTL support ===== */
  [dir="rtl"] .component-item { flex-direction: row-reverse; }
  [dir="rtl"] .sidebar { border-right: none; border-left: 1px solid var(--border); }
  [dir="rtl"] .sidebar:last-child { border-left: none; border-right: 1px solid var(--border); }
  [dir="rtl"] .controls { margin-left: 0; margin-right: auto; }
</style>
</head>
<body>

<header>
  <div class="brand">NanoSubGHz <small id="brandSub">Interactive Wiring</small></div>
  <div class="controls">
    <div class="seg" id="langSeg">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="fa">فا</button>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="schematic" class="active" data-i18n="schematic">Schematic</button>
      <button data-view="realistic" data-i18n="realistic">Realistic</button>
    </div>
    <div class="seg" id="projSeg">
      <button data-proj="2d" class="active">2D</button>
      <button data-proj="3d">3D</button>
    </div>
    <button class="btn-zoom" id="zoomOut" title="Zoom Out">−</button>
    <button class="btn-zoom" id="zoomReset" title="Reset Zoom">1:1</button>
    <button class="btn-zoom" id="zoomIn" title="Zoom In">+</button>
    <button class="btn-zoom" id="resetAll" title="Reset All">⟲</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="leftPanel">
    <h3 data-i18n="components">Components</h3>
    <ul id="componentList" style="list-style:none;"></ul>
    <div class="divider"></div>
    <label class="component-item" style="font-weight:600; cursor:pointer;">
      <input type="checkbox" id="wiresToggle" checked>
      <span data-i18n="showWires">Show Wiring</span>
    </label>
    <button class="action-btn" id="showAllWires" data-i18n="showAll">Show All Wires</button>
    <button class="action-btn" id="resetPositions" data-i18n="resetPositions">Reset Positions</button>
  </aside>

  <main class="canvas-wrap" id="canvasWrap">
    <div id="diagram">
      <svg id="svg" viewBox="0 0 1400 1230" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.18"/>
          </filter>
        </defs>
        <g id="wireLayer"></g>
        <g id="compLayer"></g>
      </svg>
    </div>
  </main>

  <aside class="sidebar" id="rightPanel">
    <div class="info-empty" id="infoEmpty" data-i18n="clickHint">
      Click any component to see its details.
    </div>
    <div id="infoContent" style="display:none;"></div>
  </aside>
</div>

<footer>
  <label>
    <span data-i18n="explode">Explosion</span>
    <input type="range" id="explodeSlider" min="0" max="100" value="0">
    <span id="explodeVal">0%</span>
  </label>
</footer>

// ==================== STATE ====================
const state = {
  lang: 'en', view: 'schematic', proj: '2d',
  zoom: 1, explode: 0,
  selected: null,
  visible: {}, positions: {},
  wiresVisible: true
};
Object.keys(COMPONENTS).forEach(id => {
  state.visible[id] = true;
  state.positions[id] = { dx: 0, dy: 0 };
});

// ==================== HELPERS ====================
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const wireLayer = document.getElementById('wireLayer');
const compLayer = document.getElementById('compLayer');

function getExplodeOffset(compId) {
  const c = COMPONENTS[compId];
  if (!c.explode) return { x: 0, y: 0 };
  const f = state.explode / 100 * 220;
  return { x: c.explode[0] * f, y: c.explode[1] * f };
}

function pinAbs(compId, pinName) {
  const c = COMPONENTS[compId];
  const p = c.pins[pinName];
  const pos = state.positions[compId];
  const ex = getExplodeOffset(compId);
  return {
    x: c.x + p.x + pos.dx + ex.x,
    y: c.y + p.y + pos.dy + ex.y
  };
}

function computeWirePath(w) {
  const a = pinAbs(w.from.comp, w.from.pin);
  const b = pinAbs(w.to.comp, w.to.pin);
  const midY = (a.y + b.y) / 2;
  if (Math.abs(b.x - a.x) < 20) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
  return `M ${a.x} ${a.y} L ${a.x} ${midY} L ${b.x} ${midY} L ${b.x} ${b.y}`;
}

function clientToSvg(cx, cy) {
  try {
    const pt = svg.createSVGPoint();
    pt.x = cx; pt.y = cy;
    const m = svg.getScreenCTM();
    if (!m) return { x: cx, y: cy };
    const p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  } catch (e) { return { x: cx, y: cy }; }
}

// ==================== VIEW ====================
function applyView() {
  const d = document.getElementById('diagram');
  d.style.transform = state.proj === '3d'
    ? 'perspective(2000px) rotateX(18deg) rotateY(-12deg)'
    : '';
  const baseW = 1400, baseH = 1230;
  const extra = state.explode / 100 * 300;
  const totalW = (baseW + extra * 2) / state.zoom;
  const totalH = (baseH + extra * 2) / state.zoom;
  const x = baseW / 2 - totalW / 2;
  const y = baseH / 2 - totalH / 2;
  svg.setAttribute('viewBox', `${x} ${y} ${totalW} ${totalH}`);
}

// ==================== RENDER ====================
function render() {
  wireLayer.innerHTML = '';
  compLayer.innerHTML = '';

  // Wires
  if (state.wiresVisible && state.explode < 75) {
    const wireOpacity = Math.max(0, 1 - state.explode / 70);
    WIRES.forEach(w => {
      if (!state.visible[w.from.comp] || !state.visible[w.to.comp]) return;
      if (state.selected && w.from.comp !== state.selected && w.to.comp !== state.selected) return;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', computeWirePath(w));
      p.setAttribute('class', 'wire');
      p.setAttribute('stroke', w.color);
      if (w.dashed) p.setAttribute('stroke-dasharray', '6,3');
      if (state.selected && (w.from.comp === state.selected || w.to.comp === state.selected)) {
        p.setAttribute('stroke-width', '3.5');
      }
      if (state.explode > 0) p.setAttribute('opacity', String(wireOpacity));
      wireLayer.appendChild(p);
    });
  }

  // Components
  Object.keys(COMPONENTS).forEach(id => {
    if (!state.visible[id]) return;
    const c = COMPONENTS[id];
    const pos = state.positions[id];
    const ex = getExplodeOffset(id);
    const x = c.x + pos.dx + ex.x;
    const y = c.y + pos.dy + ex.y;

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'comp' + (state.selected === id ? ' selected' : ''));
    g.setAttribute('data-id', id);

    // Body
    const body = document.createElementNS(NS, 'rect');
    body.setAttribute('x', x); body.setAttribute('y', y);
    body.setAttribute('width', c.w); body.setAttribute('height', c.h);
    body.setAttribute('rx', 8);
    body.setAttribute('fill', state.view === 'realistic' ? c.realisticColor : c.color);
    body.setAttribute('stroke', c.border);
    body.setAttribute('stroke-width', state.view === 'realistic' ? '1.5' : '2.5');
    body.setAttribute('class', 'comp-body');
    body.setAttribute('filter', 'url(#shadow)');
    g.appendChild(body);

    // Title
    const title = document.createElementNS(NS, 'text');
    title.setAttribute('x', x + 14);
    title.setAttribute('y', y + 22);
    title.setAttribute('font-size', '13');
    title.setAttribute('font-weight', '700');
    title.setAttribute('fill', state.view === 'realistic' ? '#ffffff' : c.border);
    title.setAttribute('font-family', 'system-ui, sans-serif');
    title.setAttribute('pointer-events', 'none');
    title.textContent = I18N[state.lang].comp_names[id];
    g.appendChild(title);

    // Pins
    Object.entries(c.pins).forEach(([pinName, pin]) => {
      const px = x + pin.x;
      const py = y + pin.y;
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', px); dot.setAttribute('cy', py);
      dot.setAttribute('r', state.view === 'realistic' ? '3' : '4.5');
      if (state.view === 'realistic') {
        dot.setAttribute('fill', '#ffd700');
        dot.setAttribute('stroke', '#000');
        dot.setAttribute('stroke-width', '0.5');
      } else {
        dot.setAttribute('class', 'pin-dot');
      }
      dot.setAttribute('pointer-events', 'none');
      g.appendChild(dot);

      if (state.view === 'schematic') {
        const lbl = document.createElementNS(NS, 'text');
        const isRight = pin.x > c.w / 2;
        lbl.setAttribute('x', px + (isRight ? 8 : -8));
        lbl.setAttribute('y', py - 6);
        lbl.setAttribute('class', 'pin-label');
        lbl.setAttribute('text-anchor', isRight ? 'start' : 'end');
        lbl.textContent = pinName;
        g.appendChild(lbl);
      }
    });

    // Realistic extras
    if (state.view === 'realistic') addRealisticDetails(g, c, x, y, id);

    compLayer.appendChild(g);
  });
}

// ==================== INFO PANEL ====================
function renderInfoPanel() {
  const panel = document.getElementById('infoContent');
  const empty = document.getElementById('infoEmpty');
  if (!state.selected) {
    panel.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  panel.style.display = 'block';
  empty.style.display = 'none';

  const c = COMPONENTS[state.selected];
  const info = c.info[state.lang];
  const t = I18N[state.lang];
  const name = t.comp_names[state.selected];

  let html = `<div class="info-title">${name}</div>`;
  html += `<div class="info-section"><h4>${t.function}</h4><p>${info.func}</p></div>`;
  html += `<div class="info-section"><h4>${t.specs}</h4><ul>${info.specs.map(s => `<li>${s}</li>`).join('')}</ul></div>`;
  html += `<div class="info-section"><h4>${t.pins}</h4><div class="pin-list">${Object.keys(c.pins).map(p => `<span class="pin-chip">${p}</span>`).join('')}</div></div>`;
  html += `<div class="info-section"><h4>${t.description}</h4><p>${info.desc}</p></div>`;

  const connected = WIRES.filter(w => w.from.comp === state.selected || w.to.comp === state.selected);
  if (connected.length) {
    html += `<div class="info-section"><h4>${t.wires}</h4><ul>${connected.map(w => {
      const from = I18N[state.lang].comp_names[w.from.comp];
      const to = I18N[state.lang].comp_names[w.to.comp];
      return `<li><b>${w.label}</b>: ${from}.${w.from.pin} → ${to}.${w.to.pin}</li>`;
    }).join('')}</ul></div>`;
  }
  panel.innerHTML = html;
}

// ==================== SIDEBAR ====================
function buildComponentList() {
  const list = document.getElementById('componentList');
  list.innerHTML = '';
  Object.keys(COMPONENTS).forEach(id => {
    const c = COMPONENTS[id];
    const li = document.createElement('li');
    const item = document.createElement('div');
    item.className = 'component-item' + (state.selected === id ? ' selected' : '');
    item.dataset.id = id;
    item.innerHTML = `
      <input type="checkbox" ${state.visible[id] ? 'checked' : ''} data-toggle="${id}">
      <span class="swatch" style="background:${c.color}; border-color:${c.border}"></span>
      <span class="comp-name">${I18N[state.lang].comp_names[id]}</span>
    `;
    item.querySelector('input').addEventListener('change', e => {
      state.visible[id] = e.target.checked;
      render();
    });
    item.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT') return;
      selectComponent(id);
    });
    li.appendChild(item);
    list.appendChild(li);
  });
}

function updateListLabels() {
  document.querySelectorAll('#componentList .comp-name').forEach(el => {
    const id = el.closest('.component-item').dataset.id;
    el.textContent = I18N[state.lang].comp_names[id];
  });
  document.querySelectorAll('#componentList .component-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === state.selected);
  });
}

// ==================== LANGUAGE ====================
function applyLanguage() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[state.lang][key]) el.textContent = I18N[state.lang][key];
  });
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('brandSub').textContent = state.lang === 'fa' ? 'سیم‌کشی تعاملی' : 'Interactive Wiring';
  updateListLabels();
  renderInfoPanel();
  render();
}

// ==================== SELECTION ====================
function selectComponent(id) {
  state.selected = (state.selected === id) ? null : id;
  updateListLabels();
  renderInfoPanel();
  render();
}

// ==================== DRAG ====================
let dragState = null;
let lastDragEndTime = 0;

compLayer.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const g = e.target.closest('.comp');
  if (!g) return;
  const id = g.dataset.id;
  dragState = {
    id,
    startX: e.clientX, startY: e.clientY,
    origDx: state.positions[id].dx,
    origDy: state.positions[id].dy,
    moved: false
  };
  document.body.style.userSelect = 'none';
  e.stopPropagation();
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const startSvg = clientToSvg(dragState.startX, dragState.startY);
  const currSvg = clientToSvg(e.clientX, e.clientY);
  const dx = currSvg.x - startSvg.x;
  const dy = currSvg.y - startSvg.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;
  state.positions[dragState.id].dx = dragState.origDx + dx;
  state.positions[dragState.id].dy = dragState.origDy + dy;
  render();
});

document.addEventListener('mouseup', () => {
  if (!dragState) return;
  if (dragState.moved) lastDragEndTime = Date.now();
  else selectComponent(dragState.id);
  dragState = null;
  document.body.style.userSelect = '';
});

// Background click = deselect
svg.addEventListener('click', e => {
  if (e.target === svg && Date.now() - lastDragEndTime > 120) {
    state.selected = null;
    updateListLabels();
    renderInfoPanel();
    render();
  }
});

});
document.getElementById('resetAll').addEventListener('click', () => {

document.getElementById('wiresToggle').addEventListener('change', e => {
  state.wiresVisible = e.target.checked;
  render();
});

document.getElementById('showAllWires').addEventListener('click', () => {
  state.selected = null;
  state.wiresVisible = true;
  document.getElementById('wiresToggle').checked = true;
  Object.keys(state.visible).forEach(id => {
    state.visible[id] = true;
    const cb = document.querySelector(`#componentList input[data-toggle="${id}"]`);
    if (cb) cb.checked = true;
  });
  updateListLabels();
  renderInfoPanel();
  render();
});

document.getElementById('resetPositions').addEventListener('click', () => {
  Object.keys(state.positions).forEach(id => state.positions[id] = { dx: 0, dy: 0 });
  render();
});

document.getElementById('explodeSlider').addEventListener('input', e => {
  state.explode = +e.target.value;
  document.getElementById('explodeVal').textContent = state.explode + '%';
  applyView();
  render();
});

// ==================== INIT ====================
buildComponentList();
applyLanguage();
applyView();
render();
</script>
</body>
</html>
